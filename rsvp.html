<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSVP | Tatianna & David</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="gate" class="gate-overlay" aria-live="polite">
      <div class="gate-card">
        <p class="eyebrow">Private Celebration</p>
        <h1>Tatianna & David</h1>
        <p class="gate-copy">Enter the shared passcode to view the wedding website and details.</p>
        <form id="gate-form">
          <label class="sr-only" for="passcode">Passcode</label>
          <input id="passcode" name="passcode" type="password" placeholder="Enter passcode" />
          <button type="submit">Enter</button>
        </form>
        <p id="gate-message" class="gate-message" role="status"></p>
      </div>
    </div>

    <div id="site-content" class="site-content hidden">
      <header class="topbar">
        <a class="brand" href="index.html">Tatianna & David</a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="story.html">Our Story</a>
          <a href="schedule.html">Schedule</a>
          <a href="travel.html">Travel</a>
          <a href="rsvp.html">RSVP</a>
          <a href="registry.html">Registry</a>
          <a href="gallery.html">Gallery</a>
          <a href="faq.html">FAQ</a>
        </nav>
      </header>

      <main>
        <section class="section">
          <div class="section-heading">
            <p class="eyebrow">RSVP</p>
            <h3>Please let us know by March 2027. Fill out the form or text Tatianna at 314-295-6210</h3>
          </div>
          <form
            class="rsvp-form"
            id="rsvp-form"
            action="https://formsubmit.co/ajax/bollwerkt@gmail.com"
            method="POST"
          >
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_cc" value="daviddeanstl@gmail.com" />
            <input type="hidden" name="_subject" value="New RSVP from the wedding website" />
            <input type="hidden" name="_template" value="table" />
            <input type="hidden" name="_next" value="https://127.0.0.1:8000/rsvp.html?submitted=1" />
            <label>Name (multiple if applicable)
              <input type="text" name="name" placeholder="Your name" required />
            </label>
            <label>Email
              <input type="email" name="email" placeholder="Your email" required />
            </label>
            <label>Attending
              <select name="attending">
                <option>Delighted to join</option>
                <option>Regretfully cannot attend</option>
              </select>
            </label>
            <label>Notes
              <textarea name="notes" rows="4" placeholder="Share any special notes here"></textarea>
            </label>
            <button class="button" type="submit">Send RSVP</button>
            <p id="rsvp-message" class="form-message"></p>
          </form>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
